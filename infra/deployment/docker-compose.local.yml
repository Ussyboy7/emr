services:
  postgres:
    image: postgres:16-alpine
    container_name: emr-postgres-local
    environment:
      POSTGRES_DB: emr_db_local
      POSTGRES_USER: emradmin
      POSTGRES_PASSWORD: emradmin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emradmin -d emr_db_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emr-redis-local
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: emr-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: emr-backend-local
    env_file:
      - ../../backend/env/local.env
    environment:
      # Override DB_HOST for Docker networking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: emr_db_local
      DB_USER: emradmin
      DB_PASSWORD: emradmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,172.19.0.0,172.19.0.1,172.19.0.2,172.19.0.3,172.19.0.4,172.19.0.5
      CSRF_TRUSTED_ORIGINS: http://localhost:8001,http://127.0.0.1:8001,http://localhost:3001,http://127.0.0.1:3001,http://frontend:3001
    volumes:
      - ../../backend:/app
      - media-data:/app/media
      - static-data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8001 emr_backend.asgi:application"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: emr-celery-worker:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: emr-celery-worker-local
    env_file:
      - ../../backend/env/local.env
    environment:
      # Override DB_HOST for Docker networking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: emr_db_local
      DB_USER: emradmin
      DB_PASSWORD: emradmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A emr_backend worker -l info
    volumes:
      - ../../backend:/app
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    image: emr-celery-beat:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: emr-celery-beat-local
    env_file:
      - ../../backend/env/local.env
    environment:
      # Override DB_HOST for Docker networking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: emr_db_local
      DB_USER: emradmin
      DB_PASSWORD: emradmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A emr_backend beat -l info
    volumes:
      - ../../backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: emr-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile.local
    container_name: emr-frontend-local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8001/ws/
      NEXT_PUBLIC_NOTIFICATIONS_WS_DISABLED: 'true'
      NEXT_PUBLIC_CLIENT_LOGGING_DISABLED: 'true'
      NODE_ENV: development
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      # Isolated from host .next; if dev 500s / ENOENT build-manifest, remove volume next-dev-cache
      - next-dev-cache:/app/.next
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  media-data:
  static-data:
  next-dev-cache:

