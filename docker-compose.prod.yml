# ================================
# EMR PRODUCTION ENVIRONMENT
# ================================
# Server: 172.16.0.32 (Server B - Primary Production)
# Domain: emr.npa.local
# Ports: 80 (HTTP), 443 (HTTPS), 22 (SSH)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: emr-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME?DB_NAME is required}
      POSTGRES_USER: ${DB_USER?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_statement=none
    ports:
      - "5434:5432"  # Different from npa-emr (5433) and npa-ecm
    networks:
      - emr-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER?DB_USER is required} -d ${DB_NAME?DB_NAME is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: emr-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD?REDIS_PASSWORD is required}
    volumes:
      - redis_data_prod:/data
    ports:
      - "6381:6379"  # Different from npa-emr (6380)
    networks:
      - emr-network-prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend (Django)
  backend:
    image: ${EMR_BACKEND_IMAGE:-emr-backend-prod}:${EMR_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: emr-backend-prod
    # Run the ASGI server (daphne) so WebSocket endpoints served by Django
    # Channels (e.g. /ws/notifications/) work. gunicorn+wsgi was HTTP-only
    # and caused client-side WS connects to fail with "connection failed".
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec daphne -b 0.0.0.0 -p 8000 --access-log /app/logs/daphne-access.log emr_backend.asgi:application"
    env_file:
      - ./backend/env/prod.env
    volumes:
      - static_files_prod:/app/staticfiles
      - media_files_prod:/app/media
      - ./docs:/docs:ro
      - ./backups:/backups:ro
      - ./logs/production:/app/logs
      - ./backend/env/prod.env:/app/env/prod.env:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emr-network-prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Celery Worker
  celery-worker:
    image: ${EMR_BACKEND_IMAGE:-emr-backend-prod}:${EMR_IMAGE_TAG:-latest}
    container_name: emr-celery-worker-prod
    env_file:
      - ./backend/env/prod.env
    command: python -m celery -A emr_backend worker -l info --concurrency=4
    volumes:
      - media_files_prod:/app/media
      - ./logs/production:/app/logs
      - ./backend/env/prod.env:/app/env/prod.env:ro
    depends_on:
      - backend
      - redis
    networks:
      - emr-network-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Beat
  celery-beat:
    image: ${EMR_BACKEND_IMAGE:-emr-backend-prod}:${EMR_IMAGE_TAG:-latest}
    container_name: emr-celery-beat-prod
    env_file:
      - ./backend/env/prod.env
    command: python -m celery -A emr_backend beat -l info
    volumes:
      - ./logs/production:/app/logs
      - ./backend/env/prod.env:/app/env/prod.env:ro
    depends_on:
      - backend
      - redis
    networks:
      - emr-network-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (Next.js)
  frontend:
    image: ${EMR_FRONTEND_IMAGE:-emr-frontend-prod}:${EMR_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time.
      # Secrets (NEXTAUTH_SECRET, etc.) are provided via env_file at runtime
      # and MUST NOT be listed here.
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws/
        NEXT_PUBLIC_ENVIRONMENT: production
        NEXT_PUBLIC_APP_NAME: Medical NPA EMR
        NEXT_PUBLIC_APP_VERSION: 1.0.0
        NEXT_PUBLIC_SENTRY_DSN: ""
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
        NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
        NEXT_PUBLIC_ENABLE_ERROR_REPORTING: "false"
    container_name: emr-frontend-prod
    env_file:
      - ./frontend/.env.prod
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - emr-network-prod
    restart: always
    healthcheck:
      # Use IPv4 loopback: `localhost` may resolve to ::1 (IPv6) inside the container,
      # while Next listens on 0.0.0.0:3000, causing false "connection refused".
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: emr-nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files_prod:/usr/share/nginx/html/static:ro
      - media_files_prod:/usr/share/nginx/html/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend
      - frontend
    networks:
      - emr-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backup Service (runs daily, in-container pg_dump against the postgres service).
  backup:
    image: postgres:15-alpine
    container_name: emr-backup-prod
    # Reuse the backend's env file so DB credentials stay in sync with the
    # live database. Previously this service relied on ${DB_PASSWORD} compose
    # interpolation from the repo-root .env, which silently fell back to the
    # default and caused pg_dump auth failures.
    env_file:
      - ./backend/env/prod.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD?REDIS_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup/docker_backup.sh:/usr/local/bin/docker_backup.sh:ro
    command: sh -c "while true; do sh /usr/local/bin/docker_backup.sh || echo 'backup failed'; sleep 86400; done"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emr-network-prod
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  static_files_prod:
    driver: local
  media_files_prod:
    driver: local

networks:
  emr-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

