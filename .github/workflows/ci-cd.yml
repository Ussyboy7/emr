name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to production after CI (requires emr-prod runner + approval)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  # Frontend build-time public vars (not secrets)
  NEXT_PUBLIC_API_URL: http://localhost:8001/api

jobs:
  # ---------------------------------------------------------------------------
  # CI — GitHub-hosted
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emr_ci
          POSTGRES_USER: emradmin
          POSTGRES_PASSWORD: emradmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emradmin -d emr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: emr_ci
      DB_USER: emradmin
      DB_PASSWORD: emradmin
      TEST_DB_NAME: test_emr_db
      DJANGO_SETTINGS_MODULE: emr_backend.settings_test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: bash scripts/ci/run-backend-tests.sh

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: TypeScript
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
        run: npm run build

  docs-check:
    name: Docs & catalog sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docs-check

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          cd frontend && npm ci

      - name: Bandit (Python — high severity)
        run: python -m bandit -r backend/accounts backend/analytics backend/appointments backend/audit backend/common backend/consultation backend/dashboard backend/eyecare backend/hr backend/laboratory backend/notifications backend/nursing backend/organization backend/patients backend/permissions backend/pharmacy backend/physiotherapy backend/radiology backend/reports backend/support backend/wards backend/emr_backend -lll -q

      - name: pip-audit (Python dependencies)
        run: python -m pip_audit -r backend/requirements.txt

      - name: npm audit (critical only)
        working-directory: frontend
        run: npm audit --audit-level=critical

  docker-validate:
    name: Docker validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: bash scripts/ci/validate-compose.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: emr-backend:ci
          cache-from: type=gha,scope=emr-backend
          cache-to: type=gha,mode=max,scope=emr-backend

      - name: Build staging frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.stag
          push: false
          load: true
          tags: emr-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_ENVIRONMENT=staging
            API_PROXY_TARGET=http://backend_stag:8000
          cache-from: type=gha,scope=emr-frontend-stag
          cache-to: type=gha,mode=max,scope=emr-frontend-stag

  publish-images:
    name: Publish images to GHCR
    needs: [backend, frontend, docs-check, security-scan, docker-validate]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name prefix
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${owner}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/emr-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/emr-backend:staging
          cache-from: type=gha,scope=emr-backend
          cache-to: type=gha,mode=max,scope=emr-backend

      - name: Build and push staging frontend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.stag
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/emr-frontend-stag:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/emr-frontend-stag:staging
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_ENVIRONMENT=staging
            API_PROXY_TARGET=http://backend_stag:8000
          cache-from: type=gha,scope=emr-frontend-stag
          cache-to: type=gha,mode=max,scope=emr-frontend-stag

      - name: Build and push production frontend
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/emr-frontend-prod:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/emr-frontend-prod:production
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=/ws/
            NEXT_PUBLIC_ENVIRONMENT=production
            NEXT_PUBLIC_APP_NAME=Medical NPA EMR
            NEXT_PUBLIC_APP_VERSION=1.0.0
            NEXT_PUBLIC_SENTRY_DSN=
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_ENABLE_ANALYTICS=false
            NEXT_PUBLIC_ENABLE_ERROR_REPORTING=false
          cache-from: type=gha,scope=emr-frontend-prod
          cache-to: type=gha,mode=max,scope=emr-frontend-prod

      - name: Tag backend for production release
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_PREFIX}/emr-backend:production" \
            "${IMAGE_PREFIX}/emr-backend:${GITHUB_SHA}"
        env:
          GITHUB_SHA: ${{ github.sha }}

  # ---------------------------------------------------------------------------
  # CD — self-hosted runners (register on staging / prod servers — see docs)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: [publish-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, emr-staging]
    environment: staging
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with env-manager
        env:
          SERVER_IP: ""
          DEPLOY_PATH: /srv/emr
          EMR_USE_REGISTRY: "1"
          EMR_IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          export EMR_BACKEND_IMAGE="ghcr.io/${owner}/emr-backend"
          export EMR_FRONTEND_IMAGE="ghcr.io/${owner}/emr-frontend-stag"
          cd "${DEPLOY_PATH}"
          ./scripts/staging/env-manager.sh deploy

      - name: Smoke test staging
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 http://172.16.0.46:4647/
          curl -fsS --retry 5 --retry-delay 5 http://172.16.0.46:8047/api/health/live/

  deploy-production:
    name: Deploy production
    needs: [publish-images]
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production == true
    runs-on: [self-hosted, emr-prod]
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with env-manager
        env:
          SERVER_IP: ""
          DEPLOY_PATH: /home/emrprod/emr
          EMR_USE_REGISTRY: "1"
          EMR_IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          export EMR_BACKEND_IMAGE="ghcr.io/${owner}/emr-backend"
          export EMR_FRONTEND_IMAGE="ghcr.io/${owner}/emr-frontend-prod"
          cd "${DEPLOY_PATH}"
          ./scripts/production/env-manager.sh deploy

      - name: Smoke test production
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 http://172.16.0.32/api/health/live/
          curl -fsS --retry 5 --retry-delay 5 http://172.16.0.32/
