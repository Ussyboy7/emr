name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_emr_db
          POSTGRES_USER: emradmin
          POSTGRES_PASSWORD: emradmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emradmin -d test_emr_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_emr_db
      DB_USER: emradmin
      DB_PASSWORD: emradmin
      DJANGO_SETTINGS_MODULE: emr_backend.settings_test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Django tests
        working-directory: backend
        run: python manage.py test accounts analytics.tests appointments audit.tests consultation common dashboard.tests eyecare hr.tests laboratory notifications nursing organization.tests patients permissions pharmacy physiotherapy radiology reports.tests wards --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest
        working-directory: frontend
        run: npm test

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify page catalog sync
        run: make docs-check
